# 本地开发数据库（PostgreSQL 16）
# 用途：让本地 next build / prisma migrate / db:seed 使用与生产一致的 postgres，
#       解决 .env 中 DATABASE_URL 为 SQLite 路径导致构建失败的问题。
# 端口用 5433 避免与本机已有 5432 冲突。
# 启动：docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: fangji-local-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fangji
    ports:
      - "5433:5432"
    volumes:
      - fangji_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fangji"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fangji_pgdata:
